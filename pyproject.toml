[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-autoencoder"
version = "0.1.0"
description = "~1B-parameter denoising Transformer autoencoder (encoder-decoder) with OpenAI-driven data generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Uttpal Tripathy" },
]
dependencies = [
    "torch>=2.1",
    "tokenizers>=0.15",
    "openai>=1.30",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "nbclient>=0.10",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "pyyaml",
    "tqdm",
]
app = [
    "gradio>=5.0",
]

[tool.setuptools.packages.find]
include = ["model*"]
